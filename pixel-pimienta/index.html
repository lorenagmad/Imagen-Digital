<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Píxel & Pimienta: el becario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECF1; --card:#FFFFFF; --ink:#1B2440; --muted:#5A6482;
  --r:#E5484D; --g:#2FA36B; --b:#3A6FF2; --note:#FFD23F; --line:#C9D3DD;
  --ok-bg:#E2F5EB; --ko-bg:#FCE6E7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A2C; --card:#1E2640; --ink:#EEF1F8; --muted:#A3ACC6;
    --r:#FF6B70; --g:#45C489; --b:#6E95FF; --note:#FFD23F; --line:#33405F;
    --ok-bg:#183A2B; --ko-bg:#45202A;
  }
}
:root[data-theme="dark"]{
  --paper:#141A2C; --card:#1E2640; --ink:#EEF1F8; --muted:#A3ACC6;
  --r:#FF6B70; --g:#45C489; --b:#6E95FF; --note:#FFD23F; --line:#33405F;
  --ok-bg:#183A2B; --ko-bg:#45202A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.5;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--ink)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.bar .floor{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;flex:1;min-width:140px}
.stat{font-weight:700;white-space:nowrap}
.btn-s{border:2px solid var(--ink);background:var(--card);border-radius:6px;padding:4px 10px;font-size:15px;font-weight:700}

/* title */
#title .wrap{text-align:center;padding-top:40px}
#logo{width:100%;max-width:640px;height:auto;image-rendering:pixelated;display:block;margin:0 auto}
.subtitle{font-size:20px;max-width:30em;margin:18px auto 28px;color:var(--muted)}
.btn{display:inline-block;border:2px solid var(--ink);background:var(--note);color:#1B2440;font-weight:700;font-size:18px;padding:12px 22px;border-radius:8px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}

/* characters */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:20px}
.char{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.char[aria-pressed="true"]{box-shadow:6px 6px 0 var(--b);transform:translate(-2px,-2px)}
.char svg{width:84px;height:84px}
.char h3{font-size:24px}
.char .tag{color:var(--muted);font-size:15px}
.perk{background:var(--note);color:#1B2440;border-radius:4px;padding:4px 8px;font-size:14px;font-weight:700;align-self:flex-start}

/* building */
.building{margin-top:18px;border:2px solid var(--ink);border-radius:10px 10px 0 0;background:var(--card);overflow:hidden}
.flr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-top:2px solid var(--ink);background:transparent;padding:14px 16px}
.flr:first-child{border-top:0}
.flr .num{flex:0 0 46px;height:46px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;background:var(--paper)}
.flr.done .num{background:var(--g);color:#fff}
.flr.open .num{background:var(--note);color:#1B2440}
.flr .t{flex:1}
.flr .t b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
.flr .t span{color:var(--muted);font-size:15px}
.flr[disabled]{opacity:.5;cursor:not-allowed}
.stars{font-size:18px;letter-spacing:2px;white-space:nowrap}
.ground{height:14px;background:var(--ink);border-radius:0 0 4px 4px}

/* dialog */
.dlg{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.dlg svg{flex:0 0 64px;width:64px;height:64px}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:4px 14px 14px 14px;padding:12px 14px;flex:1}
.bubble .who{font-weight:700;font-size:14px;color:var(--muted);display:block}
.dlg.me{flex-direction:row-reverse}
.dlg.me .bubble{border-radius:14px 4px 14px 14px;background:var(--note);color:#1B2440}
.dlg.me .bubble .who{color:#5a4a00}

/* challenge */
.task{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:18px;margin-top:16px;box-shadow:6px 6px 0 var(--ink)}
.task h2{font-size:22px;margin-bottom:8px}
.task .q{font-size:18px;margin:10px 0 14px}
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--b)}
.prog i.ok{background:var(--g)}
.formula{background:var(--paper);border-left:4px solid var(--b);padding:8px 12px;margin:10px 0;font-weight:700}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans input{font:inherit;font-size:22px;font-weight:700;width:min(260px,100%);padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
.unit{font-weight:700;font-size:20px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--ink);background:var(--paper);border-radius:8px;padding:12px 14px;text-align:left;font-size:17px}
.opt[aria-pressed="true"]{background:var(--note);color:#1B2440}
.opt.sw{display:flex;align-items:center;gap:12px}
.chip{width:40px;height:40px;border:2px solid var(--ink);border-radius:6px;flex:0 0 40px}
.swgrid{grid-template-columns:repeat(2,1fr)}
.fb{margin-top:14px;border-radius:8px;padding:12px 14px;border:2px solid var(--ink)}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)} .fb.info{background:var(--paper)}
.fb ol{margin:6px 0 0;padding-left:22px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* bits */
.bits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px}
.bit button{width:46px;height:56px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800}
.bit button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bit small{font-size:13px;color:var(--muted);font-weight:700}
.sum{text-align:center;font-size:20px;font-weight:700;margin-top:6px}

/* mixer */
.mixer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.mixer label{display:flex;flex-direction:column;font-weight:700;gap:4px}
.mixer select{font:inherit;font-size:20px;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
.preview{display:flex;gap:12px;align-items:center;margin-top:8px}
.preview .chip{width:80px;height:80px;flex-basis:80px}
.hexcode{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800}

/* depth */
#depthCanvas{width:100%;height:70px;border:2px solid var(--ink);border-radius:6px;image-rendering:pixelated;display:block}
.slider{width:100%;margin:14px 0 4px;accent-color:var(--b)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,30,.6);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.sheet h2{font-size:26px;margin-bottom:10px}
.sheet h3{font-size:19px;margin:16px 0 6px}
.sheet table{border-collapse:collapse;width:100%;font-size:15px}
.sheet td,.sheet th{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tblwrap{overflow-x:auto}
.big{font-size:44px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
.end-art{font-size:64px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){body{font-size:16px}.task{padding:14px;box-shadow:4px 4px 0 var(--ink)}.bit button{width:38px;height:50px;font-size:24px}}

/* ---------- tacto en el móvil y movimiento ----------
   Las animaciones solo existen con la clase .motion (la pone un script en <head>) y sin
   «reducir movimiento»: si el JavaScript no corre o el alumno pide menos movimiento, todo se ve quieto. */
:root{--mo-ok:var(--g);--mo-ko:var(--r);--mo-hover:var(--paper);--mo-ease:cubic-bezier(.2,.8,.2,1)}
button,a{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.backp{margin:0 0 10px;text-align:left}
.back{display:inline-block;color:var(--muted);font-weight:700;font-size:15px;text-decoration:none;padding:6px 0}
.back:hover{color:var(--ink);text-decoration:underline}
.stat{display:inline-block}
.opt,.char,.flr,.room,.gala,.btn-s,.seg button,.bit button,.lights button{transition:transform .14s var(--mo-ease),background-color .15s,border-color .15s,box-shadow .15s,color .15s}
.opt:active,.char:active,.btn-s:active,.seg button:active,.lights button:active,.bit button:active,
.flr:not([disabled]):active,.room:not([disabled]):active,.gala:not([disabled]):active{transform:scale(.97)}
.prog i{transition:background-color .3s}
@media (hover:hover){
  .flr:not([disabled]):hover,.room:not([disabled]):hover,.gala:not([disabled]):hover{background:var(--mo-hover)}
  .opt:not([aria-pressed="true"]):hover{border-color:var(--muted)}
}
@media (max-width:560px){
  .bar .wrap{gap:2px 10px;padding:8px 16px}
  .bar .wrap>span:first-child{flex:1 0 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cheatBtn2{margin-left:auto}
  .chars{grid-template-columns:1fr;gap:10px}
  .char{display:grid;grid-template-columns:64px 1fr;column-gap:14px;row-gap:2px;align-items:start;padding:12px 14px}
  .char svg{grid-row:1/4;width:64px;height:64px}
  .char .perk{justify-self:start;margin-top:4px}
}
@media (prefers-reduced-motion:no-preference){
  .motion section:not(.hidden)>.wrap{animation:mo-in .32s var(--mo-ease) backwards}
  .motion :is(.flr,.room,.gala){animation:mo-in .34s var(--mo-ease) backwards}
  .motion :is(.flr,.room,.gala):nth-child(2){animation-delay:.04s}
  .motion :is(.flr,.room,.gala):nth-child(3){animation-delay:.08s}
  .motion :is(.flr,.room,.gala):nth-child(4){animation-delay:.12s}
  .motion :is(.flr,.room,.gala):nth-child(5){animation-delay:.16s}
  .motion :is(.flr,.room,.gala):nth-child(6){animation-delay:.2s}
  .motion :is(.flr,.room,.gala):nth-child(n+7){animation-delay:.24s}
  .motion .dlg{animation:mo-pop .26s var(--mo-ease) backwards;transform-origin:0 0}
  .motion .dlg.me{transform-origin:100% 0}
  .motion .task{animation:mo-in .3s var(--mo-ease) backwards}
  .motion .fb{animation:mo-in .22s var(--mo-ease) backwards}
  .motion .fb.ok{animation:mo-ok .42s var(--mo-ease) backwards}
  .motion .fb.ko{animation:mo-shake .4s ease-out}
  .motion .modal:not(.hidden){animation:mo-fade .2s ease-out backwards}
  .motion .modal:not(.hidden) .sheet{animation:mo-sheet .32s var(--mo-ease) backwards}
  .motion .end-art span{display:inline-block;animation:mo-star .5s cubic-bezier(.3,1.5,.5,1) .12s backwards}
  .motion .end-art span:nth-child(2){animation-delay:.24s}
  .motion .end-art span:nth-child(3){animation-delay:.36s}
  .motion .stat.bump{animation:mo-bump .4s var(--mo-ease)}
  .motion .stat.hurt{animation:mo-hurt .42s ease-out}
  .motion .xa-ov{animation:mo-fade .2s ease-out backwards}
  .motion .xa-box{animation:mo-sheet .32s var(--mo-ease) backwards}
}
.av .eyes{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .motion .dlg .av .eyes,.motion .char[aria-pressed="true"] .av .eyes{animation:mo-blink 4.8s 1.2s infinite}
  .motion .char[aria-pressed="true"] .av{animation:mo-hop .42s cubic-bezier(.3,1.5,.5,1)}
}
@keyframes mo-blink{0%,94%,100%{transform:none}96.5%{transform:scaleY(.1)}}
@keyframes mo-hop{40%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes mo-in{from{opacity:0;transform:translateY(8px)}}
@keyframes mo-pop{from{opacity:0;transform:scale(.94)}}
@keyframes mo-fade{from{opacity:0}}
@keyframes mo-sheet{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes mo-ok{0%{opacity:0;transform:scale(.96)}60%{opacity:1;transform:scale(1.015)}100%{transform:none}}
@keyframes mo-shake{0%{opacity:0}15%{opacity:1}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}100%{transform:none}}
@keyframes mo-star{from{opacity:0;transform:scale(.3) rotate(-20deg)}}
@keyframes mo-bump{40%{transform:scale(1.2);color:var(--mo-ok)}}
@keyframes mo-hurt{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}50%{color:var(--mo-ko)}}
</style>
<script>document.documentElement.classList.add('motion')</script>
</head>
<body>

<!-- TITLE -->
<section id="title">
  <div class="wrap">
    <canvas id="logo" width="640" height="200" aria-label="Píxel y Pimienta"></canvas>
    <p class="subtitle">Primer día como becario en la agencia de publicidad más caótica de la ciudad. Siete plantas, un jefe imposible y un cliente de leche con muchas exigencias.</p>
    <div class="row">
      <button class="btn" id="startBtn">Empezar a trabajar</button>
      <button class="btn sec" id="cheatBtn0">Ver la chuleta</button>
    </div>
  </div>
</section>

<!-- CHARACTER -->
<section id="chars" class="hidden">
  <div class="wrap">
    <h1 style="font-size:34px;margin-top:20px">Elige a tu becario</h1>
    <p style="color:var(--muted)">Cada uno tiene una ventaja diferente. Puedes cambiarlo más tarde desde el edificio.</p>
    <div class="chars" id="charList"></div>
    <div class="row" style="justify-content:flex-start;margin-top:22px"><button class="btn" id="charOk" disabled>Entrar en la agencia</button></div>
  </div>
</section>

<!-- BUILDING -->
<section id="building" class="hidden">
  <div class="wrap">
    <div class="dlg" id="bHead"></div>
    <div class="building" id="floors"></div>
    <div class="ground"></div>
    <div class="row" style="justify-content:flex-start;margin-top:18px">
      <button class="btn sec" id="cheatBtn1">Ver la chuleta</button>
      <button class="btn sec" id="changeChar">Cambiar becario</button>
      <button class="btn sec" id="resetBtn">Borrar progreso</button>
    </div>
    <p id="totalScore" style="margin-top:14px;font-weight:700"></p>
  </div>
</section>

<!-- LEVEL -->
<section id="level" class="hidden">
  <div class="bar"><div class="wrap">
    <span class="floor" id="lvTitle"></span>
    <span class="stat" id="lvLives" aria-label="Cafés"></span>
    <span class="stat" id="lvScore"></span>
    <button class="btn-s" id="cheatBtn2">Chuleta</button>
    <button class="btn-s" id="exitBtn">Salir</button>
  </div></div>
  <div class="wrap" id="stage"></div>
</section>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const fmt = (n, d=2) => Number(n).toLocaleString('es-ES',{maximumFractionDigits:d});
const MB = 1024*1024*8;
const store = {
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function show(id){['title','chars','building','level'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));window.scrollTo(0,0)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* Acepta "16.777.216", "37,5", "37'5", "20.02", "2 097 152" */
function parseCandidates(str){
  let s=String(str).trim().replace(/\s/g,'').replace(/[a-zA-Z²]/g,'').replace(/'/g,',');
  if(!s) return [];
  const c=new Set();
  const a=s.replace(/\./g,'').replace(',', '.');  // español
  const b=s.replace(/,/g,'');                     // inglés
  [a,b].forEach(x=>{const n=parseFloat(x);if(!isNaN(n)&&/^-?[\d.]+$/.test(x))c.add(n)});
  return [...c];
}

/* ---------- avatares SVG originales ---------- */
let avN=0;
function avatar(p){
  const ink='#1B2440',H=p.hair,id='av'+(++avN);
  const light=/^#[EF]/i.test(H),stache=light?'#8A8577':H;
  const fringe=`<path d="M18.5 29c-1.5-10 4.5-17 13.5-17s15 7 13.5 17c-1.5-4-4-6.5-7-7.5-4 2.5-10 3.5-16 2.5-2 1.5-3.2 3-4 5z" fill="${H}"/>`;
  const longFront=`<path d="M18.5 31c-1.5-11 5-18.5 13.5-18.5S47 20 45.5 31c-2.5-5-6.5-8-11-9-2.5 3-7 5-12 5.5-1.5 1-3 2-4 3.5z" fill="${H}"/>`;
  const neat=`<path d="M18.5 29c-1-10 5-16 13.5-16s14.5 6 13.5 16c-3-4.5-8-6.5-13.5-6.5S21.5 24.5 18.5 29z" fill="${H}"/>`;
  const longBack=`<path d="M15 33c0-14 7-22 17-22s17 8 17 22v17c0 3-2 5-5 5H20c-3 0-5-2-5-5z" fill="${H}"/>`;
  /* pelo de detrás (antes que la cara) y de delante (encima) */
  const back={long:longBack,streak:longBack,
    bob:`<path d="M15 34c0-14 7-23 17-23s17 9 17 23c0 5-1 9-3 11H18c-2-2-3-6-3-11z" fill="${H}"/>`,
    pony:`<path d="M43 19c10 2 12 14 8 26-1-9-4-15-10-19z" fill="${H}"/>`,
    bun:`<circle cx="32" cy="11" r="7" fill="${H}"/>`,
    buns:`<circle cx="18" cy="15" r="6.5" fill="${H}"/><circle cx="46" cy="15" r="6.5" fill="${H}"/>`,
    curly:`<g fill="${H}"><circle cx="17" cy="28" r="7"/><circle cx="47" cy="28" r="7"/><circle cx="19" cy="18" r="8"/><circle cx="45" cy="18" r="8"/><circle cx="32" cy="12" r="9"/></g>`
  }[p.style]||'';
  const tufts=c=>`<path d="M18.4 31c-.8-4 .5-7 2.6-8.5l1 5c-1.5.8-2.5 2-3.6 3.5zM45.6 31c.8-4-.5-7-2.6-8.5l-1 5c1.5.8 2.5 2 3.6 3.5z" fill="${c}"/>`;
  const front={short:fringe,pony:fringe,long:longFront,bun:neat,buns:neat,
    streak:longFront+`<path d="M23 15c4 3 6 7 6.5 12" stroke="#ECECEC" stroke-width="3" stroke-linecap="round" fill="none"/>`,

    cap:tufts('#3B2A20')+`<path d="M17.5 25c0-8 6.5-13 14.5-13s14.5 5 14.5 13z" fill="${H}"/><path d="M33 24h19c2 0 2.5 2 1.2 3-1.2 1-2.8 1.5-4.2 1.5H33z" fill="${H}"/><path d="M17.5 25h29" stroke="#000" stroke-opacity=".2" stroke-width="1.5"/><circle cx="32" cy="12.6" r="1.6" fill="#000" fill-opacity=".2"/>`,

/* ---------- logo pixelado ---------- */
function drawLogo(){
  const cv=$('#logo'),ctx=cv.getContext('2d');
  const W=96,H=30,off=document.createElement('canvas');off.width=W;off.height=H;
  const o=off.getContext('2d');o.fillStyle='#000';o.textBaseline='middle';o.textAlign='center';
  o.font='bold 13px "Bricolage Grotesque", Arial, sans-serif';o.fillText('PÍXEL &',W/2,8);o.fillText('PIMIENTA',W/2,22);
  const d=o.getImageData(0,0,W,H).data,cells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(d[(y*W+x)*4+3]>110)cells.push([x,y])}
  const s=cv.width/W,cols=['#E5484D','#2FA36B','#3A6FF2'];
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1B2440';
  cv.height=H*s;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  cells.sort((a,b)=>a[0]-b[0]+(Math.random()-.5)*8);
  let i=0;
  function step(){
    const n=reduce?cells.length:24;
    for(let k=0;k<n&&i<cells.length;k++,i++){
      const [x,y]=cells[i];ctx.fillStyle=cols[(x+y)%3];ctx.fillRect(x*s,y*s,s-1,s-1);
      if(!reduce){setTimeout(()=>{ctx.fillStyle=ink;ctx.fillRect(x*s,y*s,s-1,s-1)},260)}
      else{ctx.fillStyle=ink;ctx.fillRect(x*s,y*s,s-1,s-1)}
    }
    if(i<cells.length)requestAnimationFrame(step);
  }
  step();
}

  <p>Ejemplo: 10011 = 16 + 2 + 1 = 19.</p>
  <h3>Hexadecimal (base 16)</h3><p>0–9, A=10, B=11, C=12, D=13, E=14, F=15. Cada posición vale 16^posición. Ejemplo: A3 = 10×16 + 3 = 163. Un color es #RRGGBB: tres bytes, 24 bits.</p>
  <h3>Profundidad de color</h3><p>Bits por píxel. Con n bits: <b>2^n colores</b>. 1 bit = 2 (B/N), 8 bits = 256, 16 bits = 65.536 (HiColor, 5-6-5), 24 bits = 16.777.216 (True color), 32 bits = True color + transparencias.</p>

/* reinicia una animación de la barra (puntos que suben, vidas que se pierden) */
function pulse(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function updBar(){
  $('#lvLives').textContent='☕'.repeat(run.lives)+'·'.repeat(Math.max(0,run.maxLives-run.lives));
  $('#lvLives').setAttribute('aria-label',`${run.lives} cafés`);
  $('#lvScore').textContent=`${run.score} pts`;
  {const sc=$('#lvScore'),lv=$('#lvLives');
   if(+sc.dataset.v<run.score)pulse(sc,'bump');sc.dataset.v=run.score;
   if(+lv.dataset.v>run.lives)pulse(lv,'hurt');lv.dataset.v=run.lives}
}
function speaker(key){
  if(key==='me'||key==='marta_or_me'){const c=me();return {name:c.name,av:c.av,me:true}}
  return {...NPC[key],me:false};

function playDialog(lines,done){
  let k=0;const stage=$('#stage');stage.innerHTML='';
  const box=document.createElement('div');stage.appendChild(box);
  const nextBtn=document.createElement('div');nextBtn.className='actions';
  nextBtn.innerHTML=`<button class="btn" id="dlgNext">Siguiente</button><button class="btn sec" id="dlgSkip">Saltar</button>`;
  stage.appendChild(nextBtn);
  function add(){
    const [who,txt]=lines[k];const s=speaker(who);

    d.innerHTML=avatar(s.av)+`<div class="bubble"><span class="who">${s.name}</span>${txt}</div>`;
    box.appendChild(d);k++;

function renderTask(){

  run.tries=0;run.hintUsed=false;run.paidHint=false;run.locked=false;

  const marta=me().id==='marta';
  let body='';
  if(t.type==='num'){
    body=`<div class="ans"><input id="ansIn" inputmode="decimal" autocomplete="off" aria-label="Tu respuesta"> <span class="unit">${t.unit}</span></div>`;
  }else if(t.type==='mc'){
    body=`<div class="opts ${t.sw?'swgrid':''}">${t.opts.map((o,j)=>t.sw
      ?`<button class="opt sw" data-j="${j}" aria-pressed="false" aria-label="Opción ${j+1}"><span class="chip" style="background:${o[0]}"></span>Opción ${j+1}</button>`
      :`<button class="opt" data-j="${j}" aria-pressed="false">${o[1]}</button>`).join('')}</div>`;
  }else if(t.type==='bits'){
    body=`<div class="bits">${Array.from({length:t.n},(_,j)=>{const p=t.n-1-j;return `<div class="bit"><button data-v="${2**p}" aria-pressed="false" aria-label="Bit de valor ${2**p}">0</button><small>${2**p}</small></div>`}).join('')}</div><div class="sum" id="bitSum">= 0</div>`;
  }else if(t.type==='mix'){
    const vals=['00','40','80','C0','FF'];
    body=`<div class="mixer">${['R','G','B'].map(ch=>`<label>${ch==='R'?'Rojo':ch==='G'?'Verde':'Azul'}<select data-ch="${ch}">${vals.map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('')}</div>
      <div class="preview"><span class="chip" id="mixChip"></span><span class="hexcode" id="mixHex">#000000</span></div>`;
  }else if(t.type==='depth'){
    body=`<canvas id="depthCanvas" width="256" height="20" aria-hidden="true"></canvas>
      <input class="slider" type="range" min="1" max="8" value="1" id="depthIn" aria-label="Bits de profundidad">
      <div class="sum" id="depthTxt"></div>`;
  }
  $('#stage').innerHTML=`<div class="task">
    <div class="prog">${prog}</div>

      <button class="btn" id="checkBtn">Comprobar</button>
      <button class="btn sec" id="hintBtn">${run.freeHint?'Pista (gratis)':'Pista (−30 pts)'}</button>
    </div></div>`;
  wireTask(t);
}

let mcSel=null;
function wireTask(t){
  mcSel=null;
  if(t.type==='num'){const i=$('#ansIn');i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
  if(t.type==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(run.locked)return;mcSel=+b.dataset.j;document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  if(t.type==='bits'){
    const upd=()=>{let s=0;document.querySelectorAll('.bit button').forEach(b=>{if(b.getAttribute('aria-pressed')==='true')s+=+b.dataset.v});$('#bitSum').textContent='= '+s;return s};
    document.querySelectorAll('.bit button').forEach(b=>b.onclick=()=>{if(run.locked)return;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'1':'0';upd()});
  }
  if(t.type==='mix'){
    const upd=()=>{const h=[...document.querySelectorAll('.mixer select')].map(s=>s.value).join('');$('#mixChip').style.background='#'+h;$('#mixHex').textContent='#'+h};
    document.querySelectorAll('.mixer select').forEach(s=>s.onchange=upd);upd();
  }
  if(t.type==='depth'){
    const cv=$('#depthCanvas'),ctx=cv.getContext('2d'),inp=$('#depthIn');
    const draw=()=>{const n=+inp.value,lv=2**n;
      for(let x=0;x<256;x++){const q=Math.min(lv-1,Math.floor(x/256*lv));const g=lv===1?0:Math.round(q/(lv-1)*255);ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(x,0,1,20)}
      $('#depthTxt').textContent=`${n} ${n===1?'bit':'bits'} → 2^${n} = ${lv} tonos`};
    inp.oninput=draw;draw();
  }
  $('#checkBtn').onclick=check;
  $('#hintBtn').onclick=hint;
}
function hint(){
  const t=FLOORS[run.f].tasks[run.idx];
  if(run.hintUsed)return;
  run.hintUsed=true;
  if(run.freeHint>0){run.freeHint--}else{run.paidHint=true}
  $('#hintBtn').remove();
  feedback('info',`<b>Pista:</b> ${t.hint}`);
}
function feedback(kind,html){$('#fb').innerHTML=`<div class="fb ${kind}" role="status">${html}</div>`}

function isCorrect(t){
  if(t.type==='num'){
    const c=parseCandidates($('#ansIn').value);
    if(!c.length)return null;
    return c.some(v=>t.tol?Math.abs(v-t.answer)<=Math.max(t.tol*Math.abs(t.answer),0.01):Math.abs(v-t.answer)<1e-9);
  }
  if(t.type==='mc'){if(mcSel===null)return null;return mcSel===t.answer}
  if(t.type==='bits'){let s=0;document.querySelectorAll('.bit button').forEach(b=>{if(b.getAttribute('aria-pressed')==='true')s+=+b.dataset.v});return s===t.target}
  if(t.type==='mix'){return [...document.querySelectorAll('.mixer select')].map(s=>s.value).join('')===t.target}
  if(t.type==='depth'){return +$('#depthIn').value===t.target}
}
function solHTML(t){return `<ol>${t.sol.map(s=>`<li>${s}</li>`).join('')}</ol>`}

function check(){
  if(run.locked)return;
  const t=FLOORS[run.f].tasks[run.idx];
  const ok=isCorrect(t);
  if(ok===null){feedback('info',t.type==='mc'?'Elige una opción antes de comprobar.':'Escribe un número antes de comprobar.');return}
  const c=me();
  if(ok){
    let pts=run.tries===0?100:50;if(run.paidHint)pts-=30;pts=Math.max(pts,10);
    run.score+=pts;run.results[run.idx]=true;updBar();
    lockTask(`<b>¡Correcto! +${pts} pts.</b> <i>${c.name}: “${pick(c.ok)}”</i>${solHTML(t)}`,'ok');
  }else{
    run.tries++;run.lives--;updBar();
    if(run.lives<=0){return gameOver()}
    if(run.tries>=2){
      run.results[run.idx]=false;
      lockTask(`<b>Se acabaron los intentos.</b> <i>${c.name}: “${pick(c.ko)}”</i> Así se resolvía:${solHTML(t)}`,'ko');
    }else{
      if(!run.hintUsed){run.hintUsed=true;const hb=$('#hintBtn');if(hb)hb.remove()}
      feedback('ko',`<b>No es correcto. Pierdes un café.</b> <i>${c.name}: “${pick(c.ko)}”</i><br><b>Pista:</b> ${t.hint}<br>Te queda un intento para este reto.`);
    }
  }
}
function lockTask(html,kind){
  run.locked=true;
  feedback(kind,html);
  const inp=$('#ansIn');if(inp)inp.disabled=true;
  document.querySelectorAll('.mixer select,#depthIn').forEach(e=>e.disabled=true);
  const last=run.idx===FLOORS[run.f].tasks.length-1;
  $('#acts').innerHTML=`<button class="btn" id="nextBtn">${last?'Terminar la planta':'Siguiente reto'}</button>`;
  $('#nextBtn').focus();
  $('#nextBtn').onclick=()=>{run.idx++;if(last)playDialog(FLOORS[run.f].outro,finishFloor);else renderTask()};
}
function gameOver(){
  const c=me();
  openModal(`<div class="end-art">☕</div><h2>Sin café</h2>
    <p>${c.name} se ha quedado sin cafés y Don Ramón le ha mandado a casa a descansar. Mañana será otro día (o dentro de 5 segundos).</p>
    <div class="actions"><button class="btn" id="goRetry">Repetir la planta</button><button class="btn sec" id="goOut">Volver al edificio</button></div>`);
  $('#goRetry').onclick=()=>{closeModal();startFloor(run.f)};
  $('#goOut').onclick=()=>{closeModal();toBuilding()};
}
function finishFloor(){
  const fl=FLOORS[run.f],n=run.f+1,max=fl.tasks.length*100;
  const ratio=run.score/max,st=ratio>=.9?3:ratio>=.6?2:1;
  save.stars[n]=Math.max(save.stars[n]||0,st);

  const rank=tot/maxTot>=.9?'Director/a creativo/a':tot/maxTot>=.7?'Diseñador/a senior':tot/maxTot>=.45?'Junior prometedor/a':'Becario/a con potencial';
  openModal(`<div class="end-art" aria-hidden="true">${[...'★'.repeat(st)+'☆'.repeat(3-st)].map(s=>`<span>${s}</span>`).join('')}</div>

      :`<p>${st===3?'Impecable. Don Ramón ha sonreído (dicen que pasa una vez al año).':st===2?'Buen trabajo. Repite la planta si quieres las tres estrellas.':'Superada, pero con sudores. Repítela para mejorar tu nota.'}</p>`}

    <button class="btn sec" id="fRetry">Repetir</button><button class="btn sec" id="fOut">Volver al edificio</button></div>`);
  const nx=$('#fNext');if(nx)nx.onclick=()=>{closeModal();startFloor(n)};
  $('#fRetry').onclick=()=>{closeModal();startFloor(run.f)};
  $('#fOut').onclick=()=>{closeModal();toBuilding()};
}

/* ===== Enganches del registro xAPI en este juego ===== */
(function(){
  const H={"app": "pixel-pimienta", "appName": "Píxel & Pimienta", "prefix": "P", "tema": "Tema 1", "ri": "f", "start": "startFloor", "correct": "isCorrect", "hint": "hint", "lock": "lockTask", "finish": "finishFloor","levels":()=>FLOORS};
  XA.init({id:H.app,name:H.appName});
  let t0=0,tries=0,score0=0;
  const lvl=()=>H.levels()[run[H.ri]],task=()=>lvl().tasks[run.idx];
  const tid=()=>`${H.prefix}${run[H.ri]+1}-${run.idx+1}`;
  const ext=()=>({[ 'https://imagendigital.uca.es/xapi/ext/nivel']:lvl().title,'https://imagendigital.uca.es/xapi/ext/tema':H.tema,'https://imagendigital.uca.es/xapi/ext/intento':tries});
  const wrap=(name,fn)=>{const orig=window[name];if(typeof orig!=='function')return;window[name]=function(...a){return fn(orig,a)}};
  wrap(H.start,(o,a)=>{const r=o(...a);try{XA.log('attempted','nivel',H.prefix+(a[0]+1),H.levels()[a[0]].title)}catch(e){}return r});
  wrap('renderTask',(o,a)=>{const r=o(...a);try{t0=Date.now();tries=0;score0=run.score;XA.log('attempted','reto',tid(),task().title,null,ext())}catch(e){}return r});
  wrap(H.correct,(o,a)=>{let resp='';try{resp=XA.readResponse(document.querySelector('.task'))}catch(e){}const ok=o(...a);
    try{if(ok!==null&&ok!==undefined&&!run.locked){tries++;XA.log('answered','reto',tid(),task().title,{success:!!ok,response:resp,duration:XA.dur(Date.now()-t0)},ext())}}catch(e){}return ok});
  wrap(H.hint,(o,a)=>{const before=run.hintUsed;const r=o(...a);try{if(!before&&run.hintUsed)XA.log('asked','reto','pista-'+tid(),'Pista de «'+task().title+'»',null,ext())}catch(e){}return r});
  wrap(H.lock,(o,a)=>{try{const ok=!!run.results[run.idx],pts=run.score-score0;XA.log(ok?'passed':'failed','reto',tid(),task().title,{success:ok,completion:true,score:{raw:pts,min:0,max:100,scaled:pts/100},duration:XA.dur(Date.now()-t0)},ext())}catch(e){}return o(...a)});
  wrap('gameOver',(o,a)=>{try{XA.log('failed','nivel',H.prefix+(run[H.ri]+1),lvl().title,{success:false,score:{raw:run.score}},{'https://imagendigital.uca.es/xapi/ext/motivo':'sin vidas'})}catch(e){}return o(...a)});
  wrap(H.finish,(o,a)=>{try{const L=lvl(),max=L.tasks.length*100,n=run[H.ri];XA.log('completed','nivel',H.prefix+(n+1),L.title,{completion:true,success:true,score:{raw:run.score,min:0,max,scaled:+(run.score/max).toFixed(3)}});
    if(n===H.levels().length-1)XA.log('completed','juego',H.app,H.appName,{completion:true})}catch(e){}return o(...a)});
  wrap('cheat',(o,a)=>{XA.log('experienced','herramienta','chuleta','Chuleta');return o(...a)});
  /* identificación antes de empezar y botón «Mi registro» */
  const sb=document.getElementById('startBtn'),go=sb.onclick;sb.onclick=e=>XA.ensureLogin(()=>go(e));
  const add=(after,id)=>{const b=document.getElementById(after);if(b)b.insertAdjacentHTML('afterend',`<button class="btn sec" id="${id}">Mis partidas</button>`);const nb=document.getElementById(id);if(nb)nb.onclick=()=>XA.panel()};
  add('cheatBtn0','xaReg0');add('cheatBtn1','xaReg1');
  /* borrar el progreso o abandonar un nivel también queda registrado (el registro nunca se borra) */
  const MOT='https://imagendigital.uca.es/xapi/ext/motivo';
  document.addEventListener('click',e=>{const b=e.target&&e.target.closest?e.target.closest('button'):null;if(!b)return;
    if(b.id==='rYes'||b.id==='rY')XA.log('terminated','juego',H.app,H.appName,null,{[MOT]:'borró el progreso'});
    if(b.id==='xYes'||b.id==='xY'){try{XA.log('terminated','nivel',H.prefix+(run[H.ri]+1),lvl().title,{completion:false},{[MOT]:'salió del nivel sin terminar'})}catch(err){}}},true);
  /* botón «Salir» en la pantalla de niveles */
  const r1=document.getElementById('xaReg1');
  if(r1){r1.insertAdjacentHTML('afterend','<button class="btn sec" id="xaExit">Salir</button>');document.getElementById('xaExit').onclick=()=>{
    XA.log('suspended','juego',H.app,H.appName,null,{'https://imagendigital.uca.es/xapi/ext/motivo':'salir'});
    const portal=!window.claude;
    const ov=XA.modal(`<h2>✔ Progreso guardado</h2><p>Tu partida de <b>${H.appName}</b> se ha guardado en este ordenador. Si tienes que entregarla o vas a seguir en otro ordenador, descarga tu archivo.</p>
      <div class="xa-row"><button class="xa-btn" id="xa-home">${portal?'Ir a todos los juegos':'Ir a la pantalla de inicio'}</button><button class="xa-btn sec" id="xa-take2">Descargar mi archivo</button><button class="xa-btn sec" id="xa-stay">Seguir jugando</button></div><p class="xa-err" id="xa-st2" style="color:inherit"></p>`);
    ov.querySelector('#xa-take2').onclick=async()=>{if(await XA.exportAll())ov.querySelector('#xa-st2').textContent='✔ Archivo descargado.'};
    ov.querySelector('#xa-stay').onclick=XA.close;
    ov.querySelector('#xa-home').onclick=()=>{XA.close();if(portal)location.href='../index.html';else{show('title');window.scrollTo(0,0)}}}}
  if(!window.claude){const t=document.querySelector('#title .wrap');if(t)t.insertAdjacentHTML('afterbegin','<p class="backp"><a class="back" href="../index.html">← Todos los juegos</a></p>')}
})();

</script>
</body>
</html>
