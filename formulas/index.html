<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de fórmulas · Imagen digital</title>
<meta name="description" content="Fórmulas y unidades de imagen digital explicadas y calculables paso a paso.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#FFFFFF;--ink:#1B2440;--muted:#5A6482;--line:#D6DCE6;--soft:#F5F7FA;--r:#E5484D;--g:#2FA36B;--b:#3A6FF2;--y:#FFD23F;--ok-bg:#E5F4EC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121726;--card:#1B2236;--ink:#EEF1F8;--muted:#A3ACC6;--line:#2E3752;--soft:#222A42;--r:#FF6B70;--g:#45C489;--b:#6E95FF;--ok-bg:#16352A}}
:root[data-theme="dark"]{--bg:#121726;--card:#1B2236;--ink:#EEF1F8;--muted:#A3ACC6;--line:#2E3752;--soft:#222A42;--r:#FF6B70;--g:#45C489;--b:#6E95FF;--ok-bg:#16352A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Narrow",sans-serif;line-height:1.1;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(30px,6vw,46px);font-weight:800}
.top h1 span{background:linear-gradient(90deg,var(--r),var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{margin:4px 0 0;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--y);color:#1B2440;border-radius:8px;padding:7px 13px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink)}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.banner{margin-top:12px;background:var(--card);border:2px dashed var(--r);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.back{color:inherit;font-weight:700}
details.f{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
details.f[open]{border-color:var(--ink)}
details.f summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.f summary::-webkit-details-marker{display:none}
summary .ic{flex:0 0 42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--soft);border:2px solid var(--line)}
summary .t{flex:1}summary .t b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
summary .t span{color:var(--muted);font-size:15px}
summary .ch{font-size:20px;transition:transform .15s}details[open] .ch{transform:rotate(90deg)}
.body{padding:0 16px 16px}
.formula{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(18px,3.4vw,24px);background:var(--soft);border-left:5px solid var(--b);border-radius:0 8px 8px 0;padding:10px 14px;margin:6px 0 10px}
.expl{margin:0 0 12px}
.lbl{font-weight:700;font-size:15px;margin:10px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fld label{display:block;font-weight:700;font-size:14px;margin-bottom:3px}
.fld .in{display:flex;gap:6px}
.fld input,.fld select{font:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);min-width:0}
.fld input{flex:1;width:100%}.fld select{flex:0 0 auto}
.fld.unk input{background:repeating-linear-gradient(45deg,var(--soft) 0 8px,var(--card) 8px 16px);color:var(--muted)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.res{margin-top:12px;border:2px solid var(--g);background:var(--ok-bg);border-radius:10px;padding:12px 14px}
.res.err{border-color:var(--r);background:transparent}
.res .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(22px,4.5vw,32px);line-height:1.1}
.res ol{margin:8px 0 0;padding-left:22px}
.stairs{margin-top:10px;display:grid;gap:4px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px}
.st.hl{border-color:var(--ink);background:var(--y);color:#1B2440}
.st b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
.st .u{font-weight:700;min-width:84px}
.st .op{font-size:13px;color:var(--muted)}.st.hl .op{color:#3c3c3c}
.arrow{font-size:13px;color:var(--muted);text-align:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:15px}td,th{border:1px solid var(--line);padding:4px 8px;text-align:center}
th{background:var(--soft)}
.note{font-size:14px;color:var(--muted)}
footer{margin:22px 0 10px;font-size:14px;color:var(--muted)}
/* ---------- tacto en el móvil y movimiento (solo con .motion y sin «reducir movimiento») ---------- */
:root{--mo-ease:cubic-bezier(.2,.8,.2,1)}
button,a,summary{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.btn,.seg button,details.f summary{transition:transform .14s var(--mo-ease),background-color .15s,border-color .15s,color .15s}
.btn:active,.seg button:active{transform:scale(.97)}
details.f{transition:border-color .2s}
@media (hover:hover){details.f summary:hover{background:var(--soft)}.seg button:not([aria-pressed="true"]):hover{border-color:var(--muted)}}
@media (prefers-reduced-motion:no-preference){
  .motion details.f{animation:mo-in .34s var(--mo-ease) backwards}
  .motion details.f:nth-child(2){animation-delay:.04s}
  .motion details.f:nth-child(3){animation-delay:.08s}
  .motion details.f:nth-child(4){animation-delay:.12s}
  .motion details.f:nth-child(5){animation-delay:.16s}
  .motion details.f:nth-child(n+6){animation-delay:.2s}
  .motion details.f[open] .body{animation:mo-in .26s var(--mo-ease) backwards}
  .motion .res{animation:mo-ok .4s var(--mo-ease) backwards}
  .motion .res.err{animation:mo-shake .4s ease-out}
  .motion .st{animation:mo-in .3s var(--mo-ease) backwards}
  .motion .st:nth-child(3){animation-delay:.05s}.motion .st:nth-child(5){animation-delay:.1s}
  .motion .st:nth-child(7){animation-delay:.15s}.motion .st:nth-child(9){animation-delay:.2s}
  .motion .st:nth-child(n+11){animation-delay:.25s}
  .motion .xa-box{animation:mo-in .3s var(--mo-ease) backwards}
}
@keyframes mo-in{from{opacity:0;transform:translateY(8px)}}
@keyframes mo-ok{0%{opacity:0;transform:scale(.96)}60%{opacity:1;transform:scale(1.015)}100%{transform:none}}
@keyframes mo-shake{0%{opacity:0}15%{opacity:1}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script>document.documentElement.classList.add('motion')</script>
</head>
<body>
<div class="wrap">
  <p id="backP" style="margin:0 0 6px"></p>
  <div class="top">
    <div><h1>Laboratorio de <span>fórmulas</span></h1><p>Elige qué quieres calcular, escribe los datos que conoces y te explico la solución paso a paso.</p></div>
    <div class="who" id="who"></div>
  </div>
  <div id="banner"></div>
  <div id="list"></div>
  <footer>Usa coma o punto para los decimales. 1 KB = 1024 bytes · 1 MB = 1024 KB · 1 GB = 1024 MB · 1 byte = 8 bits · 1 pulgada = 2,54 cm.</footer>
</div>
<script>
/* ===== Registro de actividad xAPI común (portal, juegos y laboratorio de fórmulas) =====
   Identidad y registro se guardan en el navegador con claves compartidas: si todas las páginas
   están publicadas en el mismo sitio (por ejemplo, usuario.github.io), el alumno se identifica una
   sola vez y un único archivo de registro reúne la actividad de todas. */
const XA=(()=>{
  const K_ID='uca_id',K_LOG='uca_xapi',BASE='https://imagendigital.uca.es/xapi';
  const VERB={launched:'inició',initialized:'empezó',experienced:'visitó',interacted:'usó',attempted:'abrió',answered:'respondió',asked:'pidió una pista en',passed:'superó',failed:'no superó',completed:'completó',suspended:'pausó',resumed:'retomó',terminated:'reinició'};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)}));
  const anonCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='PF-';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
  let APP={id:'portal',name:'Portal'},ID=st.get(K_ID,null);
  if(!ID){const old=st.get('pdf_id',null);if(old&&old.email){ID={name:old.name,email:old.email,consent:old.consent,anon:old.anon||anonCode()};st.set(K_ID,ID)}}
  if(ID&&!ID.anon){ID.anon=anonCode();st.set(K_ID,ID)}
  const reg=()=>{const k='uca_reg_'+APP.id;let r=st.get(k,null);if(!r){r=uuid();st.set(k,r)}return r};
  const iri=(kind,id)=>`${BASE}/${APP.id}/${kind}/${encodeURIComponent(id)}`;
  function log(verb,kind,id,name,result,ext){if(!ID)return;const L=st.get(K_LOG,[]);
    if(verb==='suspended'&&L.length&&L[L.length-1].verb.id.endsWith('/suspended')&&L[L.length-1].context.platform===APP.name)return;
    const s={id:uuid(),actor:{objectType:'Agent',name:ID.name,mbox:'mailto:'+ID.email},verb:{id:'http://adlnet.gov/expapi/verbs/'+verb,display:{'es-ES':VERB[verb]||verb}},
      object:{objectType:'Activity',id:iri(kind,id),definition:{name:{'es-ES':name||String(id)},type:'http://adlnet.gov/expapi/activities/'+({reto:'cmi.interaction',nivel:'module',juego:'simulation',herramienta:'interaction'}[kind]||'interaction')}},
      timestamp:new Date().toISOString(),
      context:{registration:reg(),platform:APP.name,language:'es-ES',contextActivities:{grouping:[{objectType:'Activity',id:`${BASE}/${APP.id}`}]},
        extensions:Object.assign({[BASE+'/ext/codigo-anonimo']:ID.anon,[BASE+'/ext/app']:APP.name},ext||{})}};
    if(result)s.result=result;L.push(s);st.set(K_LOG,L)}
  const dur=ms=>'PT'+(Math.max(0,ms)/1000).toFixed(1)+'S';
  /* ---- ventanas propias (no dependen del estilo de cada página) ---- */
  const css=`.xa-ov{position:fixed;inset:0;background:rgba(10,12,20,.7);display:grid;place-items:center;padding:12px;z-index:9999}
  .xa-box{background:#fff;color:#22202A;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .xa-box h2{margin:0 0 8px;font-size:24px;line-height:1.15}.xa-box p{margin:6px 0}.xa-box label{display:grid;gap:4px;font-weight:700;margin-top:10px}
  .xa-box input[type=text],.xa-box input[type=email]{font:inherit;font-size:17px;padding:9px 11px;border:2px solid #CFCAD8;border-radius:8px}
  .xa-box .xa-ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:#55506A}.xa-box .xa-ck input{width:20px;height:20px;margin-top:2px}
  .xa-err{color:#C8243A;font-weight:700;min-height:1.4em}.xa-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .xa-btn{font:inherit;font-weight:700;border:2px solid #22202A;background:#E3A92B;color:#22202A;border-radius:8px;padding:8px 14px;cursor:pointer}.xa-btn.sec{background:#fff}
  @media (prefers-color-scheme: dark){.xa-box{background:#1E2236;color:#F1EEE8}.xa-box input[type=text],.xa-box input[type=email]{background:#15182A;color:#F1EEE8;border-color:#343A55}.xa-box .xa-ck{color:#ABA6B8}.xa-btn.sec{background:#1E2236;color:#F1EEE8;border-color:#F1EEE8}}`;
  function modal(html){let ov=document.getElementById('xa-ov');if(!document.getElementById('xa-css')){const t=document.createElement('style');t.id='xa-css';t.textContent=css;document.head.appendChild(t)}
    if(!ov){ov=document.createElement('div');ov.id='xa-ov';ov.className='xa-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov)}
    ov.innerHTML=`<div class="xa-box">${html}</div>`;ov.hidden=false;return ov}
  const close=()=>{const ov=document.getElementById('xa-ov');if(ov)ov.remove()};
  function ensureLogin(cb){if(ID){cb&&cb();return}
    const ov=modal(`<h2>Identifícate</h2><p>Antes de empezar, escribe tu nombre y tu correo de la UCA. Solo se pide una vez.</p>
      <label>Nombre y apellidos<input type="text" id="xa-n" autocomplete="name"></label>
      <label>Correo de la UCA<input type="email" id="xa-m" autocomplete="email" placeholder="nombre@alum.uca.es"></label>
      <label class="xa-ck"><input type="checkbox" id="xa-ok"><span>Acepto que mis acciones (retos, respuestas, tiempos y uso de las herramientas) se guarden en un archivo junto a mi nombre y correo. Ese archivo lo entrego yo al profesorado (por correo o en la tarea del Campus Virtual) para analizar el aprendizaje. Mis datos identificativos no se publicarán: si los resultados se difunden, se usará solo un código anónimo.</span></label>
      <p class="xa-err" id="xa-e"></p><div class="xa-row"><button class="xa-btn" id="xa-go">Entrar</button><button class="xa-btn sec" id="xa-no">Volver</button></div>`);
    setTimeout(()=>ov.querySelector('#xa-n').focus(),30);
    ov.querySelector('#xa-no').onclick=close;
    ov.querySelector('#xa-go').onclick=()=>{const n=ov.querySelector('#xa-n').value.trim().replace(/\s+/g,' '),m=ov.querySelector('#xa-m').value.trim().toLowerCase(),e=ov.querySelector('#xa-e');
      if(n.length<3)return e.textContent='Escribe tu nombre y apellidos.';
      if(!/^[^@\s]+@(alum\.)?uca\.es$/.test(m))return e.textContent='Usa tu correo de la UCA (@uca.es o @alum.uca.es).';
      if(!ov.querySelector('#xa-ok').checked)return e.textContent='Para continuar tienes que aceptar el registro de actividad.';
      ID={name:n,email:m,consent:new Date().toISOString(),anon:anonCode()};st.set(K_ID,ID);close();log('launched','juego',APP.id,APP.name);onId.forEach(f=>f(ID));cb&&cb()}}
  const onId=[];
  /* ---- descargas ---- */
  async function saveFile(filename,data){try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename,data});return true}}catch(e){if(e&&e.code==='declined')return false}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true}
  function toCSV(L){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const E=k=>BASE+'/ext/'+k;
    const rows=[['codigo_anonimo','app','email','nombre','actividad','verbo','objeto_id','objeto','timestamp','duracion_s','exito','puntos','intento','respuesta','nivel']];
    for(const s of L){const cx=s.context.extensions||{},r=s.result||{},nm=s.object.definition.name['es-ES'];
      rows.push([cx[E('codigo-anonimo')],s.context.platform,s.actor.mbox.replace('mailto:',''),s.actor.name,`${s.verb.display['es-ES']} · ${nm}`,s.verb.display['es-ES'],s.object.id,nm,s.timestamp,r.duration?parseFloat(r.duration.slice(2)):'',r.success==null?'':r.success,r.score?r.score.raw:'',cx[E('intento')]||'',r.response||'',cx[E('nivel')]||''])}
    return '\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')}
  function panel(){const L=st.get(K_LOG,[]);
    const ov=modal(`<h2>Mis partidas</h2>${ID?`<p><b>${ID.name}</b> · ${ID.email}<br>${SAVES.map(([k,n])=>`${n}: ${progTxt(st.get(k,null))}`).join(' · ')}</p>`:'<p>Todavía no te has identificado.</p>'}
      <p>Tus partidas y tus acciones (${L.length}) se guardan en este navegador. Descarga tu archivo para:</p>
      <ul style="margin:4px 0;padding-left:20px"><li><b>Entregarlo</b> a tu profesor/a, por correo o en la tarea del Campus Virtual.</li><li><b>Seguir en otro ordenador o móvil</b>: allí pulsa «Cargar partidas».</li></ul>
      <div class="xa-row">${ID?'<button class="xa-btn" id="xa-tk">Descargar mi archivo</button>':''}<button class="xa-btn sec" id="xa-ld">Cargar partidas</button><button class="xa-btn sec" id="xa-b">Cerrar</button></div>
      <p class="xa-err" id="xa-st" style="color:inherit"></p>
      ${ID?'<p style="font-size:13px;margin-top:10px"><a href="#" id="xa-x" style="color:inherit">No soy yo / cambiar de alumno</a></p>':''}`);
    const tk=ov.querySelector('#xa-tk');if(tk)tk.onclick=async()=>{if(await exportAll())ov.querySelector('#xa-st').textContent='✔ Archivo descargado.'};
    ov.querySelector('#xa-ld').onclick=importAll;ov.querySelector('#xa-b').onclick=close;
    const x=ov.querySelector('#xa-x');if(x)x.onclick=e=>{e.preventDefault();const ov2=modal(`<h2>¿Cambiar de alumno?</h2><p>Se borrarán de este navegador las partidas y las acciones de <b>${ID.name}</b>. Si no ha descargado su archivo, que lo haga antes.</p><div class="xa-row"><button class="xa-btn" id="xa-y">Cambiar de alumno</button><button class="xa-btn sec" id="xa-n2">Cancelar</button></div>`);
      ov2.querySelector('#xa-n2').onclick=panel;ov2.querySelector('#xa-y').onclick=()=>{ID=null;try{[K_ID,K_LOG,...SAVES.map(x=>x[0])].forEach(k=>localStorage.removeItem(k))}catch(e){}close();onId.forEach(f=>f(null));location.reload()}}}
  /* ---- llevar y cargar las partidas (progreso de los juegos + registro) ---- */
  const SAVES=[['pp_save','Píxel & Pimienta'],['gt_save','Gráficas Tóner'],['sf_save','Sin Filtro']];
  const prog=v=>v?((v.unlocked||1)-1)*10+Object.values(v.stars||{}).reduce((a,b)=>a+(+b||0),0):-1;
  const progTxt=v=>v&&v.char?`${Object.keys(v.stars||{}).length} nivel(es) superado(s), ${Object.values(v.stars||{}).reduce((a,b)=>a+(+b||0),0)} ★`:'sin empezar';
  async function exportAll(){if(!ID){ensureLogin(exportAll);return false}
    log('suspended','juego',APP.id,APP.name,null,{[BASE+'/ext/motivo']:'descargar archivo'});
    const saves={};SAVES.forEach(([k])=>{const v=st.get(k,null);if(v)saves[k]=v});
    const pack={format:'imagen-digital-partidas',version:1,exported:new Date().toISOString(),id:ID,saves,xapi:st.get(K_LOG,[])};
    const tag=ID.email.split('@')[0]+'_'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
    return saveFile(`imagen-digital_${tag}.json`,JSON.stringify(pack))}
  function mergeLogs(a,b){const m=new Map();[...a,...b].forEach(x=>{if(x&&x.id)m.set(x.id,x)});return [...m.values()].sort((x,y)=>x.timestamp<y.timestamp?-1:1)}
  function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='none';document.body.appendChild(inp);
    inp.onchange=async()=>{const f=inp.files[0];inp.remove();if(!f)return;let pk=null;try{pk=JSON.parse(await f.text())}catch(e){}
      if(!pk||pk.format!=='imagen-digital-partidas'||!pk.id||!pk.id.email){const ov=modal(`<h2>Archivo no válido</h2><p>Este archivo no es una partida de Imagen digital. Busca el que se llama <b>imagen-digital_…json</b>.</p><div class="xa-row"><button class="xa-btn" id="xa-b">Vale</button></div>`);ov.querySelector('#xa-b').onclick=close;return}
      const other=ID&&ID.email!==pk.id.email;
      const rows=SAVES.map(([k,n])=>{const here=st.get(k,null),file=(pk.saves||{})[k]||null,keep=!other&&prog(here)>prog(file);return {k,n,here,file,keep}});
      const apply=()=>{if(other){try{localStorage.removeItem(K_LOG)}catch(e){}SAVES.forEach(([k])=>{try{localStorage.removeItem(k)}catch(e){}})}
        ID={...pk.id,anon:pk.id.anon||(ID&&!other&&ID.anon)||anonCode()};st.set(K_ID,ID);
        rows.forEach(r=>{if(!r.keep&&r.file)st.set(r.k,r.file)});
        st.set(K_LOG,mergeLogs(other?[]:st.get(K_LOG,[]),pk.xapi||[]));
        log('resumed','juego',APP.id,APP.name,null,{[BASE+'/ext/motivo']:'partidas cargadas desde archivo'});
        const ov=modal(`<h2>✔ Partidas cargadas</h2><p>Ya puedes seguir jugando, <b>${ID.name.split(' ')[0]}</b>.</p><ul style="margin:6px 0;padding-left:20px">${rows.map(r=>`<li>${r.n}: ${progTxt(r.keep?r.here:(r.file||r.here))}${r.keep?' (se conserva la de este dispositivo, que va más avanzada)':''}</li>`).join('')}</ul><div class="xa-row"><button class="xa-btn" id="xa-ok2">Continuar</button></div>`);
        ov.querySelector('#xa-ok2').onclick=()=>{close();location.reload()}};
      const ov=modal(`<h2>${other?`¿Cargar las partidas de ${pk.id.name}?`:'Partidas encontradas'}</h2>
        ${other?`<p>En este navegador están las partidas y el registro de <b>${ID.name}</b>. Si cargas las de ${pk.id.name}, se sustituirán. Si ${ID.name} no ha entregado su registro, que lo descargue antes.</p>`:`<p><b>${pk.id.name}</b> · ${(pk.xapi||[]).length} acciones registradas.</p>`}
        <ul style="margin:6px 0;padding-left:20px">${rows.map(r=>`<li>${r.n}: ${progTxt(r.file)}${r.keep?' · <i>este dispositivo va más avanzado y se conserva</i>':''}</li>`).join('')}</ul>
        <p style="font-size:14px;opacity:.8">El registro de actividad del archivo ${other?'sustituirá':'se juntará con'} el de este dispositivo.</p>
        <div class="xa-row"><button class="xa-btn" id="xa-go2">${other?'Cargar las de '+pk.id.name.split(' ')[0]:'Cargar y seguir jugando'}</button><button class="xa-btn sec" id="xa-b">Cancelar</button></div>`);
      ov.querySelector('#xa-b').onclick=close;ov.querySelector('#xa-go2').onclick=apply};
    inp.click()}
  function init(app){APP=app;if(ID)log('launched','juego',APP.id,APP.name);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)log('suspended','juego',APP.id,APP.name);else log('resumed','juego',APP.id,APP.name)});
    window.addEventListener('pagehide',()=>log('suspended','juego',APP.id,APP.name))}
  /* respuesta visible en la ventana del reto, para el registro */
  function readResponse(root){root=root||document;const out=[];
    const bits=root.querySelector('.bits');if(bits)return [...bits.querySelectorAll('button')].map(b=>b.getAttribute('aria-pressed')==='true'?'1':'0').join('');
    const mix=root.querySelector('.mixer');if(mix)return '#'+[...mix.querySelectorAll('select')].map(x=>x.value).join('');
    root.querySelectorAll('input[type=text],input:not([type]),input[inputmode],input[type=number]').forEach(i=>{if(i.offsetParent!==null&&i.value!=='')out.push(i.value.trim())});
    root.querySelectorAll('select').forEach(s=>{if(s.offsetParent!==null&&s.value!=='')out.push(s.options[s.selectedIndex].text)});
    root.querySelectorAll('input[type=range]').forEach(r=>{if(r.offsetParent!==null)out.push((r.getAttribute('aria-label')||r.id)+' '+r.value)});
    root.querySelectorAll('[aria-pressed="true"]').forEach(b=>{if(b.offsetParent!==null)out.push(b.textContent.trim().replace(/\s+/g,' ').slice(0,60))});
    return out.join(' | ').slice(0,400)}
  return {init,log,dur,ensureLogin,panel,readResponse,modal,close,exportAll,importAll,onIdentity:f=>onId.push(f),get id(){return ID},saveFile}
})();

</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:d});
const big=n=>{n=Number(n);const a=Math.abs(n);return a>0&&a<0.01?n.toLocaleString('es-ES',{maximumSignificantDigits:4}):n.toLocaleString('es-ES',{maximumFractionDigits:4})};
const num=v=>{let s=String(v||'').trim().replace(/\s/g,'').replace(/'/g,',');if(!s)return NaN;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))};
const U={bit:1,byte:8,KB:8*1024,MB:8*1024**2,GB:8*1024**3,TB:8*1024**4};
const UN={bit:'bits',byte:'bytes',KB:'KB',MB:'MB',GB:'GB',TB:'TB'};
const unitSel=(id,def='MB',opts=['bit','byte','KB','MB','GB'])=>`<select id="${id}" aria-label="Unidad">${opts.map(u=>`<option value="${u}" ${u===def?'selected':''}>${UN[u]}</option>`).join('')}</select>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- escalera de unidades ---------- */
function stairs(bits,hl){const order=['TB','GB','MB','KB','byte','bit'];
  return `<div class="stairs" aria-label="Equivalencias">${order.map((u,i)=>{const v=bits/U[u];const nxt=order[i+1];
    return `<div class="st ${u===hl?'hl':''}" style="margin-left:${i*14}px"><span class="u">${UN[u]}</span><b>${big(v)}</b><span class="op">${u==='bit'?'':''}</span></div>${nxt?`<div class="arrow" style="margin-left:${i*14+20}px">↑ ÷ ${nxt==='bit'?8:1024}   ·   ↓ × ${nxt==='bit'?8:1024}</div>`:''}`}).join('')}</div>`}

/* ---------- definición de las fórmulas ---------- */
const F=[
 {id:'unidades',ic:'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 2v20M17 2v20" stroke="#B7793E" stroke-width="2.6" stroke-linecap="round"/><path d="M7 6h10M7 11h10M7 16h10" stroke="#D9A15E" stroke-width="2.2"/></svg>',title:'Escalera de unidades',sub:'Pasa de bits a bytes, KB, MB, GB y TB',
  formula:'1 byte = 8 bits · 1 KB = 1024 bytes · 1 MB = 1024 KB · 1 GB = 1024 MB',
  expl:'Para <b>subir</b> de unidad (de bits a bytes, de bytes a KB…) se <b>divide</b>; para <b>bajar</b>, se <b>multiplica</b>. Entre bits y bytes el número es 8; entre las demás, 1024.',
  vars:null,
  ui:()=>`<div class="grid"><div class="fld"><label for="u_v">Valor</label><div class="in"><input id="u_v" inputmode="decimal" placeholder="150994944">${unitSel('u_u','bit',['bit','byte','KB','MB','GB','TB'])}</div></div></div>`,
  ex:()=>{$('#u_v').value='150994944';$('#u_u').value='bit'},
  calc:()=>{const v=num($('#u_v').value),u=$('#u_u').value;if(!(v>=0))throw 'Escribe un valor.';const bits=v*U[u];
    return {big:`${big(v)} ${UN[u]}`,steps:[`Lo paso todo a bits: ${big(v)} × ${big(U[u])} = ${big(bits)} bits`,`Desde ahí, cada escalón hacia arriba divide (÷ 8 y después ÷ 1024) y hacia abajo multiplica.`],extra:stairs(bits,u),log:`${big(v)} ${UN[u]}`}}},

 {id:'peso',ic:'🖼️',title:'Peso de una imagen',sub:'Ancho × alto × profundidad de color',
  formula:'Peso (bits) = ancho (px) × alto (px) × profundidad (bits)',
  expl:'Cada píxel necesita tantos bits como su profundidad de color. Multiplicando los píxeles por los bits de cada uno obtienes el peso sin comprimir en bits; luego subes por la escalera hasta KB o MB. Si hay varias imágenes iguales, se multiplica por el número de imágenes.',
  vars:[['peso','Peso'],['ancho','Ancho'],['alto','Alto'],['prof','Profundidad']],
  ui:k=>`<div class="grid">
    ${fld('ancho','Ancho','px',k)}${fld('alto','Alto','px',k)}${fld('prof','Profundidad de color','bits',k)}
    <div class="fld ${k==='peso'?'unk':''}"><label for="p_peso">Peso${k==='peso'?' (incógnita)':''}</label><div class="in"><input id="p_peso" inputmode="decimal" ${k==='peso'?'disabled placeholder="?"':''}>${unitSel('p_pu','MB')}</div></div>
    ${fld('n','Nº de imágenes iguales','',null,'1')}</div>`,
  ex:k=>{const d={ancho:'2048',alto:'3072',prof:'24',peso:'18',n:'1'};for(const x in d){const e=$('#p_'+x);if(e&&!e.disabled)e.value=d[x]}$('#p_pu').value='MB'},
  calc:k=>{const g=x=>num($('#p_'+x).value),n=g('n')||1,pu=$('#p_pu').value;
    if(k==='peso'){const a=g('ancho'),h=g('alto'),p=g('prof');need(a,h,p);const bits=a*h*p*n;
      return {big:`${big(bits/U[pu])} ${UN[pu]}`,steps:[`${big(a)} × ${big(h)} × ${big(p)}${n>1?` × ${n} imágenes`:''} = ${big(bits)} bits`,`÷ 8 = ${big(bits/8)} bytes`,`Y subiendo por la escalera: ${big(bits/U[pu])} ${UN[pu]}`],extra:stairs(bits,pu),log:`${a}×${h}×${p}${n>1?'×'+n:''} → ${fmt(bits/U[pu])} ${UN[pu]}`}}
    const bits=g('peso')*U[pu];if(!(bits>0))throw 'Escribe el peso disponible.';
    if(k==='prof'){const a=g('ancho'),h=g('alto');need(a,h);const p=bits/(a*h*n),pf=Math.floor(p+1e-9);
      return {big:`${pf} bits`,steps:[`Peso en bits: ${big(g('peso'))} ${UN[pu]} = ${big(bits)} bits`,`Profundidad = bits ÷ (ancho × alto${n>1?' × nº imágenes':''}) = ${big(bits)} ÷ ${big(a*h*n)} = ${fmt(p,3)}`,`Se redondea hacia abajo (si no, no cabría): <b>${pf} bits</b> → 2^${pf} = ${big(2**pf)} colores`],log:`prof máx ${pf} bits`}}
    const other=k==='ancho'?'alto':'ancho',o=g(other),p=g('prof');need(o,p);const v=bits/(o*p*n),vf=Math.floor(v+1e-9);
    return {big:`${vf} px de ${k}`,steps:[`Peso en bits: ${big(bits)} bits`,`${k[0].toUpperCase()+k.slice(1)} = bits ÷ (${other} × profundidad${n>1?' × nº imágenes':''}) = ${big(bits)} ÷ ${big(o*p*n)} = ${fmt(v,3)}`,`Hacia abajo, porque no se puede pasar del espacio: <b>${vf} px</b>`],log:`${k} máx ${vf}`}}},

 {id:'colores',ic:'🎨',title:'Profundidad y número de colores',sub:'Colores = 2 elevado a los bits',
  formula:'Colores = 2ⁿ  (n = bits de profundidad)',
  expl:'Con n bits por píxel hay 2ⁿ combinaciones posibles, es decir, 2ⁿ colores. Si conoces los colores y buscas los bits, busca el n más pequeño con 2ⁿ ≥ colores.',
  vars:[['col','Colores'],['bits','Bits']],
  ui:k=>`<div class="grid">${fld('bits','Profundidad','bits',k,'','c')}${fld('col','Número de colores','colores',k,'','c')}</div>`,
  ex:k=>{if(k==='col')$('#c_bits').value='24';else $('#c_col').value='5'},
  calc:k=>{if(k==='col'){const n=num($('#c_bits').value);need(n);return {big:`${big(2**n)} colores`,steps:[`2^${n} = ${big(2**n)} colores`],log:`${n} bits → ${2**n}`}}
    const c=num($('#c_col').value);need(c);const n=Math.max(1,Math.ceil(Math.log2(c)-1e-9));
    return {big:`${n} bits`,steps:[`Busco el n más pequeño con 2ⁿ ≥ ${big(c)}`,`2^${n-1} = ${big(2**(n-1))} ${2**(n-1)>=c?'≥':'<'} ${big(c)}${n>1?' (no llega)':''}`,`2^${n} = ${big(2**n)} ≥ ${big(c)} → <b>${n} bits</b>`],log:`${c} colores → ${n} bits`}}},

 {id:'resolucion',ic:'📏',title:'Resolución: píxeles y centímetros',sub:'De píxeles a cm y al revés',
  formula:'cm = px × 2,54 ÷ ppp   ·   px = cm × ppp ÷ 2,54   ·   ppp = px × 2,54 ÷ cm',
  expl:'La resolución (ppp o dpi) es cuántos píxeles caben en una pulgada, y una pulgada mide 2,54 cm. Con dos de los tres datos sacas el tercero.',
  vars:[['cm','Centímetros'],['px','Píxeles'],['ppp','Resolución']],
  ui:k=>`<div class="grid">${fld('px','Píxeles','px',k,'','r')}${fld('cm','Medida','cm',k,'','r')}${fld('ppp','Resolución','ppp',k,'','r')}</div>`,
  ex:k=>{const d={px:'2480',cm:'21',ppp:'300'};for(const x in d){const e=$('#r_'+x);if(!e.disabled)e.value=d[x]}},
  calc:k=>{const g=x=>num($('#r_'+x).value);
    if(k==='cm'){const px=g('px'),p=g('ppp');need(px,p);const inch=px/p;return {big:`${fmt(inch*2.54)} cm`,steps:[`Pulgadas = px ÷ ppp = ${big(px)} ÷ ${big(p)} = ${fmt(inch,3)} in`,`cm = pulgadas × 2,54 = ${fmt(inch*2.54,3)} cm`],log:`${px}px ${p}ppp → ${fmt(inch*2.54)} cm`}}
    if(k==='px'){const cm=g('cm'),p=g('ppp');need(cm,p);const inch=cm/2.54;return {big:`${Math.round(inch*p)} px`,steps:[`Pulgadas = cm ÷ 2,54 = ${big(cm)} ÷ 2,54 = ${fmt(inch,3)} in`,`px = pulgadas × ppp = ${fmt(inch,3)} × ${big(p)} = ${fmt(inch*p,2)} → <b>${Math.round(inch*p)} px</b>`],log:`${cm}cm ${p}ppp → ${Math.round(inch*p)} px`}}
    const px=g('px'),cm=g('cm');need(px,cm);const inch=cm/2.54;return {big:`${fmt(px/inch,1)} ppp`,steps:[`Pulgadas = cm ÷ 2,54 = ${fmt(inch,3)} in`,`ppp = px ÷ pulgadas = ${big(px)} ÷ ${fmt(inch,3)} = ${fmt(px/inch,1)} ppp`],log:`${px}px ${cm}cm → ${fmt(px/inch,1)} ppp`}}},

 {id:'transmision',ic:'<svg viewBox="0 0 24 24" width="24" height="24"><rect x="10" y="1" width="4" height="3" rx="1" fill="#5A6482"/><path d="M18.5 5.5l1.6-1.6" stroke="#5A6482" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14" r="8.5" fill="#fff" stroke="#3A6FF2" stroke-width="2.4"/><path d="M12 14V9.5M12 14l3.2 2" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14" r="1.3" fill="#1B2440"/></svg>',title:'Velocidad de transmisión',sub:'Cuánto tarda en subir o bajar un archivo',
  formula:'Tiempo (s) = tamaño (Mb) ÷ velocidad (Mbps)   ·   1 MB = 8 Mb',
  expl:'Las conexiones se miden en <b>megabits</b> por segundo (Mbps), y los archivos en <b>megabytes</b> (MB). Pasa el tamaño a megabits multiplicando por 8 y divide entre la velocidad. Si solo puedes usar una parte de la conexión, multiplica la velocidad por ese porcentaje.',
  vars:[['t','Tiempo'],['size','Tamaño'],['v','Velocidad']],
  ui:k=>`<div class="grid"><div class="fld ${k==='size'?'unk':''}"><label for="t_size">Tamaño${k==='size'?' (incógnita)':''}</label><div class="in"><input id="t_size" inputmode="decimal" ${k==='size'?'disabled placeholder="?"':''}>${unitSel('t_su','MB',['KB','MB','GB'])}</div></div>
    ${fld('v','Velocidad','Mbps',k,'','t')}${fld('t','Tiempo','s',k,'','t')}${fld('pct','Porcentaje disponible','%',null,'100','t')}</div>`,
  ex:k=>{const d={size:'24',v:'16',t:'12'};for(const x in d){const e=$('#t_'+x);if(!e.disabled)e.value=d[x]}},
  calc:k=>{const g=x=>num($('#t_'+x).value),su=$('#t_su').value,pct=(g('pct')||100)/100,toMb=x=>x*U[su]/U.MB*8;
    if(k==='t'){const s=g('size'),v=g('v');need(s,v);const mb=toMb(s),ve=v*pct;return {big:`${fmt(mb/ve)} s`,steps:[`Tamaño en megabits: ${big(s)} ${UN[su]} = ${fmt(mb,3)} Mb`,pct<1?`Velocidad útil: ${big(v)} × ${fmt(pct*100)} % = ${fmt(ve,3)} Mbps`:`Velocidad: ${big(v)} Mbps`,`Tiempo = ${fmt(mb,3)} ÷ ${fmt(ve,3)} = <b>${fmt(mb/ve)} s</b>${mb/ve>=60?` (≈ ${fmt(mb/ve/60)} min)`:''}`],log:`${s}${UN[su]} ${v}Mbps → ${fmt(mb/ve)} s`}}
    if(k==='size'){const t=g('t'),v=g('v');need(t,v);const mb=t*v*pct,s=mb/8*U.MB/U[su];return {big:`${fmt(s)} ${UN[su]}`,steps:[`Megabits = tiempo × velocidad = ${big(t)} × ${fmt(v*pct,3)} = ${fmt(mb,3)} Mb`,`÷ 8 = ${fmt(mb/8,3)} MB${su!=='MB'?` = ${fmt(s,3)} ${UN[su]}`:''}`],log:`${t}s ${v}Mbps → ${fmt(s)} ${UN[su]}`}}
    const s=g('size'),t=g('t');need(s,t);const mb=toMb(s),v=mb/t/pct;return {big:`${fmt(v)} Mbps`,steps:[`Tamaño en megabits: ${fmt(mb,3)} Mb`,`Velocidad = megabits ÷ tiempo = ${fmt(mb,3)} ÷ ${big(t)} = ${fmt(mb/t,3)} Mbps${pct<1?`, y como solo se usa el ${fmt(pct*100)} %: ${fmt(v,3)} Mbps de conexión`:''}`],log:`${s}${UN[su]} ${t}s → ${fmt(v)} Mbps`}}},

 {id:'proporcion',ic:'📐',title:'Proporciones',sub:'Medidas a partir de la proporción, o redimensionar sin deformar',
  formula:'a = p·α · b = q·α   ·   p·α × q·α = píxeles   →   α = √(píxeles ÷ (p × q))',
  expl:'Una proporción p:q (ancho:alto) significa que el ancho son p partes y el alto q partes del mismo tamaño α. Si sabes el espacio y la profundidad, primero calculas los píxeles (bits ÷ profundidad), luego α, y después las medidas, redondeando hacia abajo. Para redimensionar sin deformar: alto nuevo = ancho nuevo × alto ÷ ancho.',
  vars:[['medidas','Medidas por espacio'],['redim','Redimensionar']],
  ui:k=>k==='medidas'?`<div class="grid">${fld('p','Proporción: ancho (p)','',null,'16','q')}${fld('q','Proporción: alto (q)','',null,'9','q')}
     <div class="fld"><label for="q_sp">Espacio disponible</label><div class="in"><input id="q_sp" inputmode="decimal">${unitSel('q_su','MB')}</div></div>${fld('prof','Profundidad','bits',null,'24','q')}</div>`
    :`<div class="grid">${fld('w0','Ancho original','px',null,'','q')}${fld('h0','Alto original','px',null,'','q')}${fld('w1','Ancho nuevo','px',null,'','q')}</div>`,
  ex:k=>{if(k==='medidas'){$('#q_sp').value='0,5';$('#q_su').value='MB'}else{$('#q_w0').value='4000';$('#q_h0').value='3000';$('#q_w1').value='1200'}},
  calc:k=>{const g=x=>num($('#q_'+x).value);
    if(k==='redim'){const w0=g('w0'),h0=g('h0'),w1=g('w1');need(w0,h0,w1);const h1=w1*h0/w0;return {big:`${fmt(w1,0)} × ${fmt(Math.round(h1),0)} px`,steps:[`Alto nuevo = ancho nuevo × alto ÷ ancho = ${big(w1)} × ${big(h0)} ÷ ${big(w0)} = ${fmt(h1,2)} px`],log:`${w0}×${h0} → ancho ${w1}: alto ${fmt(h1)}`}}
    const p=g('p'),q=g('q'),pr=g('prof'),su=$('#q_su').value,sp=g('sp');need(p,q,pr,sp);const bits=sp*U[su],pix=Math.floor(bits/pr),a=Math.sqrt(pix/(p*q)),w=Math.floor(p*a+1e-9),h=Math.floor(q*a+1e-9),left=bits-w*h*pr;
    return {big:`${w} × ${h} px`,steps:[`Espacio en bits: ${big(sp)} ${UN[su]} = ${big(bits)} bits`,`Píxeles = ${big(bits)} ÷ ${pr} = ${big(bits/pr)} → ${big(pix)} px`,`${p}α · ${q}α = ${big(pix)} → ${p*q}α² = ${big(pix)} → α² = ${fmt(pix/(p*q),3)} → α = ${fmt(a,3)}`,`Ancho = ${p} × ${fmt(a,3)} ≈ ${w} px · Alto = ${q} × ${fmt(a,3)} ≈ ${h} px (hacia abajo)`,`Sobra: ${big(left)} bits ≈ ${fmt(left/U.MB,4)} MB`],log:`${p}:${q} ${sp}${UN[su]} ${pr}b → ${w}×${h}`}}},

 {id:'espacio',ic:'🗄️',title:'¿Cuántas imágenes caben?',sub:'Espacio disponible ÷ peso de cada imagen',
  formula:'Nº de imágenes = (espacio − otros contenidos) ÷ peso de una imagen   (hacia abajo)',
  expl:'Resta lo que ocupa el texto u otros contenidos, calcula el peso de una imagen y divide. El resultado se redondea siempre hacia abajo: media imagen no se puede publicar.',
  vars:null,
  ui:()=>`<div class="grid"><div class="fld"><label for="e_sp">Espacio total</label><div class="in"><input id="e_sp" inputmode="decimal">${unitSel('e_su','MB')}</div></div>
    <div class="fld"><label for="e_tx">Otros contenidos (texto…)</label><div class="in"><input id="e_tx" inputmode="decimal" value="0">${unitSel('e_tu','MB')}</div></div>
    ${fld('ancho','Ancho de cada imagen','px',null,'','e')}${fld('alto','Alto de cada imagen','px',null,'','e')}${fld('prof','Profundidad','bits',null,'24','e')}</div>`,
  ex:()=>{$('#e_sp').value='2';$('#e_tx').value='0,6';$('#e_ancho').value='304';$('#e_alto').value='351';$('#e_prof').value='24'},
  calc:()=>{const g=x=>num($('#e_'+x).value),sp=g('sp')*U[$('#e_su').value],tx=(g('tx')||0)*U[$('#e_tu').value],a=g('ancho'),h=g('alto'),p=g('prof');need(sp,a,h,p);
    const free=sp-tx,one=a*h*p,n=Math.floor(free/one+1e-9);
    return {big:`${n} ${n===1?'imagen':'imágenes'}`,steps:[`Espacio libre: ${fmt(free/U.MB,4)} MB (${big(free)} bits)`,`Una imagen: ${big(a)} × ${big(h)} × ${big(p)} = ${big(one)} bits ≈ ${fmt(one/U.MB,4)} MB`,`${big(free)} ÷ ${big(one)} = ${fmt(free/one,3)} → <b>${n}</b> (hacia abajo)`],log:`${fmt(sp/U.MB)}MB-${fmt(tx/U.MB)}MB, ${a}×${h}×${p} → ${n}`}}},

 {id:'bases',ic:'🔢',title:'Binario, decimal y hexadecimal',sub:'Convierte entre sistemas de numeración',
  formula:'Valor = Σ (símbolo × baseᵖᵒˢⁱᶜⁱᵒⁿ)',
  expl:'En cada sistema, cada posición vale la base elevada a esa posición, contando desde 0 por la derecha: en binario 1, 2, 4, 8…; en hexadecimal 1, 16, 256… (A = 10 … F = 15).',
  vars:[['2','Desde binario'],['10','Desde decimal'],['16','Desde hexadecimal']],
  ui:k=>`<div class="grid"><div class="fld"><label for="b_v">Número en base ${k}</label><div class="in"><input id="b_v" autocomplete="off" spellcheck="false" placeholder="${k==='2'?'10011':k==='16'?'A3':'200'}"></div></div></div>`,
  ex:k=>{$('#b_v').value=k==='2'?'10011':k==='16'?'A3':'200'},
  calc:k=>{const base=+k,raw=$('#b_v').value.trim().toUpperCase();const ok={2:/^[01]+$/,10:/^\d+$/,16:/^[0-9A-F]+$/}[base];if(!ok.test(raw))throw `Escribe un número válido en base ${base}.`;
    const val=parseInt(raw,base);const digits=[...raw];
    const table=base===10?'':`<div class="tbl"><table><tr><th>Posición</th>${digits.map((_,i)=>`<td>${digits.length-1-i}</td>`).join('')}</tr><tr><th>Símbolo</th>${digits.map(d=>`<td><b>${d}</b></td>`).join('')}</tr><tr><th>Valor posicional</th>${digits.map((_,i)=>`<td>${big(base**(digits.length-1-i))}</td>`).join('')}</tr><tr><th>Total</th>${digits.map((d,i)=>`<td>${big(parseInt(d,16)*base**(digits.length-1-i))}</td>`).join('')}</tr></table></div>`;
    return {big:`${val} en decimal`,steps:[base===10?`Decimal: ${val}`:`Suma de los totales = ${val}`,`Binario: ${val.toString(2)}`,`Hexadecimal: ${val.toString(16).toUpperCase()}`],extra:table,log:`${raw} (base ${base}) → ${val}`}}}
];
function fld(id,label,unit,k,def='',pre='p'){const unk=k===id;return `<div class="fld ${unk?'unk':''}"><label for="${pre}_${id}">${label}${unit?` (${unit})`:''}${unk?' · incógnita':''}</label><div class="in"><input id="${pre}_${id}" inputmode="decimal" ${unk?'disabled placeholder="?"':''} value="${unk?'':def}"></div></div>`}
function need(...a){if(a.some(v=>!(v>0)))throw 'Faltan datos: rellena todos los campos que no son la incógnita.'}

/* ---------- interfaz ---------- */
const state={};
function render(){
  $('#list').innerHTML=F.map(f=>`<details class="f" id="d_${f.id}"><summary><span class="ic" aria-hidden="true">${f.ic}</span><span class="t"><b>${f.title}</b><span>${f.sub}</span></span><span class="ch" aria-hidden="true">›</span></summary><div class="body" id="b_${f.id}"></div></details>`).join('');
  F.forEach(f=>{const d=$('#d_'+f.id);d.addEventListener('toggle',()=>{if(d.open){paint(f);XA.log('experienced','herramienta',f.id,f.title)}})})}
function paint(f){const k=state[f.id]||(f.vars?f.vars[0][0]:null);state[f.id]=k;
  $('#b_'+f.id).innerHTML=`<div class="formula">${f.formula}</div><p class="expl">${f.expl}</p>
    ${f.vars?`<div class="lbl">${f.id==='bases'?'¿Desde qué sistema?':f.id==='proporcion'?'¿Qué quieres hacer?':'¿Cuál es la incógnita?'}</div><div class="seg" role="group">${f.vars.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===k}">${l}</button>`).join('')}</div>`:''}
    <div class="lbl">Datos</div>${f.ui(k)}
    <div class="act"><button class="btn" id="go_${f.id}">Calcular</button><button class="btn sec" id="ex_${f.id}">Poner un ejemplo</button></div><div id="r_${f.id}"></div>`;
  $$(`#b_${f.id} .seg button`).forEach(b=>b.onclick=()=>{state[f.id]=b.dataset.v;paint(f)});
  $('#ex_'+f.id).onclick=()=>f.ex(k);
  $('#go_'+f.id).onclick=()=>{const out=$('#r_'+f.id);try{const r=f.calc(k);out.innerHTML=`<div class="res" role="status"><div class="big">${r.big}</div><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${r.extra||''}</div>`;
      XA.log('interacted','herramienta',f.id+(k?'-'+k:''),f.title+(k&&f.vars?' · '+f.vars.find(v=>v[0]===k)[1]:''),{response:r.log,success:true})}
    catch(e){out.innerHTML=`<div class="res err" role="status">${esc(typeof e==='string'?e:'No he podido calcularlo: revisa los datos.')}</div>`;XA.log('interacted','herramienta',f.id+(k?'-'+k:''),f.title,{response:'datos incompletos',success:false})}};
  $$(`#b_${f.id} input`).forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')$('#go_'+f.id).click()}))}
function who(){const id=XA.id;$('#who').innerHTML=id?`<span>Hola, <b>${esc(id.name.split(' ')[0])}</b></span><button class="btn sec" id="wReg">Mis partidas</button>`:'<button class="btn" id="wIn">Identificarme</button><button class="btn sec" id="wReg">Mis partidas</button>';
  const r=$('#wReg');if(r)r.onclick=()=>XA.panel();const i=$('#wIn');if(i)i.onclick=()=>XA.ensureLogin(who);
  $('#banner').innerHTML=id?'':`<div class="banner"><span>Identifícate para que tu uso del laboratorio quede en tu registro de actividad.</span><button class="btn" id="bIn">Identificarme</button></div>`;
  const b=$('#bIn');if(b)b.onclick=()=>XA.ensureLogin(who)}
XA.init({id:'formulas',name:'Laboratorio de fórmulas'});XA.onIdentity(who);render();who();
if(!window.claude)$('#backP').innerHTML='<a class="back" href="../index.html">← Todos los juegos</a>';
if(!XA.id)XA.ensureLogin(who);
</script>
</body>
</html>
